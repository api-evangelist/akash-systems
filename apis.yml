name: Akash Systems
description: >-
  Akash Systems is an Oakland, California deep-tech semiconductor company that
  pioneers Diamond Cooling thermal-management technology, integrating synthetic
  diamond directly with semiconductors such as Gallium Nitride (GaN) to remove
  heat up to five times faster than copper. Its Chip-on-Diamond and diamond-cooled
  server products target AI and data-center compute, while its GaN power
  amplifiers and satellite radios serve space communications, radar, cellular,
  and automotive/EV markets. Akash Systems is a hardware and materials company
  with no public developer API or documentation surface; it was surfaced as a
  DCVC portfolio company and added to the API Evangelist network as a stub for
  enrichment.
